<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app's icon: a lantern glowing in the dark. Rendered to icon.png with `npm run icon`. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="56%" r="50%">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#e0af68" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e0af68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="65%" r="55%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#e08a3c"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23253a"/>
      <stop offset="1" stop-color="#121219"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b3f5c"/>
      <stop offset="0.5" stop-color="#7a82a8"/>
      <stop offset="1" stop-color="#3b3f5c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="290" r="230" fill="url(#glow)"/>
  <!-- Handle ring -->
  <path d="M206 128 a50 50 0 0 1 100 0" fill="none" stroke="url(#metal)" stroke-width="18" stroke-linecap="round"/>
  <!-- Cap -->
  <path d="M176 176 L256 124 L336 176 Z" fill="url(#metal)"/>
  <rect x="166" y="170" width="180" height="22" rx="8" fill="#7a82a8"/>
  <!-- Glass -->
  <rect x="184" y="192" width="144" height="168" rx="18" fill="#ffcf7a" fill-opacity="0.18" stroke="#c0caf5" stroke-opacity="0.35" stroke-width="4"/>
  <!-- Flame -->
  <path d="M256 222 C286 262 292 292 280 316 C272 332 240 332 232 316 C220 292 228 264 256 222 Z" fill="url(#flame)"/>
  <ellipse cx="256" cy="312" rx="12" ry="16" fill="#fffaf0"/>
  <!-- Frame bars -->
  <rect x="176" y="192" width="14" height="168" rx="5" fill="url(#metal)"/>
  <rect x="322" y="192" width="14" height="168" rx="5" fill="url(#metal)"/>
  <!-- Base -->
  <rect x="160" y="356" width="192" height="26" rx="9" fill="#7a82a8"/>
  <rect x="186" y="380" width="140" height="16" rx="6" fill="#3b3f5c"/>
</svg>
