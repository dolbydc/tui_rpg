# Local Postgres for development: `docker compose up -d`.
# Host port 5434 so it runs alongside forest (5432) and shadows (5433).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tui_rpg
      POSTGRES_USER: tui_rpg
      POSTGRES_PASSWORD: tui_rpg
    ports:
      - "5434:5432"
    volumes:
      - tui-rpg-pgdata:/var/lib/postgresql

volumes:
  tui-rpg-pgdata:
